<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mesajlaşma</title>
<style>
:root{--bg:#101418;--fg:#eaf0ee;--mut:#8fa09b;--acc:#3aa68c;--card:#1a2127;--line:#2a343b;--mine:#2b6f5f;box-sizing:border-box}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f7f6;--fg:#1b2623;--mut:#60726c;--acc:#23826b;--card:#fff;--line:#d9e3df;--mine:#d3efe6}}
:root[data-theme="light"]{--bg:#f4f7f6;--fg:#1b2623;--mut:#60726c;--acc:#23826b;--card:#fff;--line:#d9e3df;--mine:#d3efe6}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:10px 14px}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
input{font:inherit;width:100%;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:11px 12px}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#auth{height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
#auth .box{width:100%;max-width:340px}
#auth h1{font-size:1.5rem;margin:0 0 16px;font-weight:600}
#auth input{margin-bottom:10px}
#auth .btns{display:flex;gap:8px}#auth .btns button{flex:1}
#err{color:#e0627a;min-height:1.3em;margin:8px 0 0;font-size:.9rem}
#app{height:100%;display:grid;grid-template-columns:300px 1fr}
#side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid var(--line)}
.top b{overflow:hidden;text-overflow:ellipsis}
.find{display:flex;gap:6px;padding:10px}
#serr{padding:0 12px;color:var(--mut);font-size:.85rem;min-height:1.2em}
#list{overflow-y:auto;flex:1}
.c{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:12px}
.c.act{background:var(--card)}
.c b{display:block}.c span{display:block;color:var(--mut);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c.un b::after{content:" •";color:var(--acc)}
#chat{display:flex;flex-direction:column;min-height:0}
#chead{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
#back{display:none}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);align-self:flex-start;white-space:pre-wrap;word-wrap:break-word}
.m.me{align-self:flex-end;background:var(--mine)}
.m small{display:block;color:var(--mut);font-size:.7rem;margin-top:2px}
#empty{margin:auto;color:var(--mut)}
#form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
@media (max-width:700px){
 #app{grid-template-columns:1fr}
 #chat{display:none}#app.chatting #side{display:none}#app.chatting #chat{display:flex}
 #back{display:inline-block}
}
</style>
</head>
<body>
<div id="auth">
  <div class="box">
    <h1>Mesajlaşma</h1>
    <input id="nick" type="text" placeholder="Takma ad" autocomplete="username" maxlength="20" aria-label="Takma ad">
    <input id="pw" type="password" placeholder="Şifre" autocomplete="current-password" maxlength="100" aria-label="Şifre">
    <div class="btns"><button class="p" id="li">Giriş yap</button><button id="rg">Kayıt ol</button></div>
    <p id="err" role="alert"></p>
  </div>
</div>

<div id="app" hidden>
  <aside id="side">
    <div class="top"><b id="me"></b><button id="out">Çıkış</button></div>
    <div class="find"><input id="q" type="text" placeholder="Takma ad ara" maxlength="20" aria-label="Kullanıcı ara"><button class="p" id="fq">Aç</button></div>
    <div id="serr"></div>
    <div id="list"></div>
  </aside>
  <section id="chat">
    <div id="chead"><button id="back" aria-label="Geri">←</button><b id="who">Sohbet seç</b></div>
    <div id="msgs"><div id="empty">Bir kullanıcı ara veya sohbet seç.</div></div>
    <form id="form" hidden><input id="txt" type="text" maxlength="1000" placeholder="Mesaj yaz…" autocomplete="off" aria-label="Mesaj"><button class="p" id="sd">Gönder</button></form>
  </section>
</div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var token=null,ws,me="",cur="",convos={},unread={};
try{token=localStorage.getItem("tk")}catch(e){}

function api(p,b){
 return fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)})
  .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Hata");return j})});
}
function doAuth(kind){
 $("err").textContent="";
 api("/api/"+kind,{nick:$("nick").value.trim(),pw:$("pw").value}).then(function(j){
  token=j.token;try{localStorage.setItem("tk",token)}catch(e){}
  $("pw").value="";connect();
 }).catch(function(e){$("err").textContent=e.message});
}
$("li").onclick=function(){doAuth("login")};
$("rg").onclick=function(){doAuth("register")};
$("pw").onkeydown=function(e){if(e.key==="Enter")doAuth("login")};

function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function connect(){
 if(!token)return;
 ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
 ws.onopen=function(){send({t:"auth",token:token})};
 ws.onmessage=function(e){
  var m;try{m=JSON.parse(e.data)}catch(x){return}
  if(m.t==="ready"){
   me=m.me;$("me").textContent=me;convos={};
   m.convos.forEach(function(c){convos[c.nick]=c});
   $("auth").hidden=true;$("app").hidden=false;renderList();
   if(cur)send({t:"hist",with:cur});
  }else if(m.t==="bad"){logoutLocal()}
  else if(m.t==="found"){
   if(m.nick)openChat(m.nick);else $("serr").textContent="Kullanıcı bulunamadı";
  }else if(m.t==="hist"){
   if(m.with===cur){$("msgs").innerHTML="";m.msgs.forEach(function(x){addMsg(x.from,x.text,x.ts)});if(!m.msgs.length)emptyNote()}
  }else if(m.t==="msg"){
   var other=m.from===me?m.to:m.from;
   convos[other]={nick:other,last:m.text,ts:m.ts};
   if(other===cur){var em=$("empty");if(em)em.remove();addMsg(m.from,m.text,m.ts)}
   else if(m.from!==me)unread[other]=1;
   renderList();
  }
 };
 ws.onclose=function(){if(token)setTimeout(connect,2000)};
}
function logoutLocal(){
 token=null;try{localStorage.removeItem("tk")}catch(e){}
 if(ws){try{ws.close()}catch(e){}}
 cur="";convos={};unread={};
 $("app").hidden=true;$("auth").hidden=false;$("app").classList.remove("chatting");
}
$("out").onclick=function(){var t=token;logoutLocal();if(t)api("/api/logout",{token:t}).catch(function(){})};

function renderList(){
 var box=$("list");box.innerHTML="";
 Object.keys(convos).map(function(k){return convos[k]}).sort(function(a,b){return b.ts-a.ts}).forEach(function(c){
  var b=document.createElement("button");
  b.className="c"+(c.nick===cur?" act":"")+(unread[c.nick]?" un":"");
  var n=document.createElement("b");n.textContent=c.nick;
  var l=document.createElement("span");l.textContent=c.last||"";
  b.appendChild(n);b.appendChild(l);
  b.onclick=function(){openChat(c.nick)};
  box.appendChild(b);
 });
}
function openChat(n){
 cur=n;delete unread[n];$("serr").textContent="";$("q").value="";
 $("who").textContent=n;$("form").hidden=false;
 $("msgs").innerHTML="";$("app").classList.add("chatting");
 renderList();send({t:"hist",with:n});$("txt").focus();
}
function emptyNote(){var d=document.createElement("div");d.id="empty";d.textContent="Henüz mesaj yok.";$("msgs").appendChild(d)}
function addMsg(from,text,ts){
 var d=document.createElement("div");d.className="m"+(from===me?" me":"");
 d.appendChild(document.createTextNode(text));
 var s=document.createElement("small");
 s.textContent=new Date(ts).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
 d.appendChild(s);$("msgs").appendChild(d);$("msgs").scrollTop=$("msgs").scrollHeight;
}
$("fq").onclick=function(){
 var q=$("q").value.trim();if(!q)return;
 $("serr").textContent="";send({t:"find",q:q});
};
$("q").onkeydown=function(e){if(e.key==="Enter")$("fq").click()};
$("form").onsubmit=function(e){
 e.preventDefault();
 var t=$("txt").value.trim();if(!t||!cur)return;
 send({t:"msg",to:cur,text:t});$("txt").value="";
};
$("back").onclick=function(){$("app").classList.remove("chatting");cur="";renderList()};
if(token)connect();
})();
</script>
</body>
</html>
